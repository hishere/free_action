name: Faster Whisper JA to VTT

on: push

jobs:
  whisper:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1


    - uses: actions/setup-python@v5

    - name: Ensure FFmpeg
      run: |
        if ! command -v ffmpeg >/dev/null 2>&1; then
          echo "Installing FFmpeg..."
          sudo apt-get update
          sudo apt-get install -y ffmpeg
        else
          echo "FFmpeg already installed."
        fi

    - name: Install faster-whisper
      run: |
        pip install faster-whisper

    - name: Download MP3 from URL file
      run: |
        mkdir -p audio
        url=$(cat latest.txt | tr -d '\n')
        echo "Downloading $url"
        curl -L --fail --retry 3 -o audio/latest.mp3 "$url"
    

    - name: Transcribe latest MP3
      run: |
        mkdir -p output
        mp3="audio/latest.mp3"
        python - <<EOF
        from faster_whisper import WhisperModel
        import os
    
        def format_time(s):
            h = int(s // 3600)
            m = int((s % 3600) // 60)
            sec = s % 60
            return f"{h:02d}:{m:02d}:{sec:06.3f}"
    
        mp3 = "$mp3"
        model = WhisperModel("small", compute_type="int8")
    
        segments, _ = model.transcribe(
            mp3,
            language="ja",
            beam_size=5
        )
    
        base = os.path.splitext(os.path.basename(mp3))[0]
        with open(f"output/{base}.vtt", "w", encoding="utf-8") as f:
            f.write("WEBVTT\n\n")
            for seg in segments:
                f.write(f"{format_time(seg.start)} --> {format_time(seg.end)}\n")
                f.write(f"{seg.text.strip()}\n\n")
        EOF
    

    - name: Upload VTT
      uses: actions/upload-artifact@v4
      with:
        name: vtt
        path: output/*.vtt
