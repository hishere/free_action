name: Faster Whisper JA to VTT

on: push

jobs:
  whisper:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1


    - uses: actions/setup-python@v5

    - name: Ensure FFmpeg
      run: |
        if ! command -v ffmpeg >/dev/null 2>&1; then
          echo "Installing FFmpeg..."
          sudo apt-get update
          sudo apt-get install -y ffmpeg
        else
          echo "FFmpeg already installed."
        fi

    - name: Install faster-whisper
      run: |
        pip install faster-whisper

    - name: Download MP3 from URL file
      run: |
        mkdir -p audio
        url=$(cat latest.txt | tr -d '\n')
        echo "Downloading $url"
        curl -L --fail --retry 3 -o audio/latest.mp3 "$url"
    
    - name: Convert to 16kHz mono WAV
      run: |
        ffmpeg -y -i audio/latest.mp3 -ar 16000 -ac 1 audio/input.wav
    

    - name: Transcribe latest MP3
      run: |
        mkdir -p output        
        mp3="audio/input.wav"
        python - <<EOF
        from faster_whisper import WhisperModel
        import os
    
        def format_time(s):
            h = int(s // 3600)
            m = int((s % 3600) // 60)
            sec = int(s % 60)
            ms = int((s - int(s)) * 1000)
            return f"{h:02d}:{m:02d}:{sec:02d}.{ms:03d}"

    
        mp3 = "$mp3"
        model = WhisperModel(
            "large-v3",
            compute_type="float16"
        )
        
        segments, _ = model.transcribe(
            mp3,
            language="ja",
            beam_size=10,
            best_of=10,
            temperature=(0.0, 0.2),
            vad_filter=True
        )

    
        base = os.path.splitext(os.path.basename(mp3))[0]
        with open(f"output/{base}.vtt", "w", encoding="utf-8") as f:
            f.write("WEBVTT\n\n")
            for seg in segments:
                f.write(f"{format_time(seg.start)} --> {format_time(seg.end)}\n")
                f.write(f"{seg.text.strip()}\n\n")
        EOF
    

    - name: Upload VTT
      uses: actions/upload-artifact@v4
      with:
        name: vtt
        path: output/*.vtt
