name: Whisper to VTT

on:
  workflow_dispatch:

jobs:
  whisper:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install FFmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Install Whisper
      run: pip install openai-whisper

    - name: Generate same-name VTT
      run: |
        mkdir -p output
        whisper audio/test.mp3 \
          --language zh \
          --model base \
          --output_format vtt \
          --output_dir output

    - name: Upload VTT
      uses: actions/upload-artifact@v4
      with:
        name: vtt
        path: output/test.vtt
